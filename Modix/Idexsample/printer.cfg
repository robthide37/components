event_delay: 10
[filament_switch_sensor Filament_Secondary]
pause_on_runout: True
switch_pin: PG13
event_delay: 10
[gcode_button EMERGENCY_STOP]
pin: !PG15
press_gcode: M112
release_gcode: 

; *************************************************
[duplicate_pin_override]
pins: PG14

[gcode_button Palette_slow]
pin: PG14
press_gcode:  M220 S100
release_gcode: M220 S3

[filament_switch_sensor PalettePin]
pause_on_runout: False
runout_gcode:  M220 S3
    UPDATE_DELAYED_GCODE ID=CHECK_SPOOL DURATION=10
insert_gcode: M220 S100
switch_pin: PG14

[delayed_gcode CHECK_SPOOL]
initial_duration: 0
gcode:
    {% if printer["filament_switch_sensor PalettePin"].filament_detected == True %}
        {action_respond_info("Splicing")}
    {% else %}
        {action_respond_info("Failed Splice")}
        M220 S100
        Pause
    {% endif %}
; ********************

