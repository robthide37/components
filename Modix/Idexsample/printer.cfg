## ---------------------------------------------
## Auxillary & Macros

[gcode_macro Service_Position_Primary]
gcode:
    # M291 S3 R"Move Head To Front" P"Press OK to continue, or CANCEL to abort"
    G90
    T0
    G1 X400.0 Y5.0 Z240.0 F10000 ;

[gcode_macro Go_Ready_Primary]
gcode:
    # M291 S3 R"Move Head To X300 Y300 Z10" P"Press OK to continue, or CANCEL to abort"
    G90
    T0
    G0 X0 Y0 Z10.0 F10000

[gcode_macro SET_TOOLS]
gcode:
    G28 ; Home
    BED_ON ; Power to the Bed SSR
    BED_MESH_PROFILE LOAD=70C
    T0
    M104 S240 ; Set Primary Nozzle temp, don't wait
    T1
    M104 S210 ; Set Secondary Nozzle temp, don't wait
    T0
    ; QUAD_GANTRY_LEVEL
    ; G28 Z ; Rehome Z
    G1 X350 Y100 Z55 F15000
    G1 Z50 F5000

[gcode_macro Filament_Load]
gcode:
    G91
    G92 E0
    G1 E50 F3000 # Ease into loading
    G1 E850 F12000 # Fast load to reach extruder
    G1 E125 F1200 # Ease into HE50
    G1 E75 F600 # Purge
    G92 E0
    G90

[gcode_macro Filament_Unload]
gcode:
    G91
    G92 E0
    G1 E-50 F3000 # Slowly pull from Hotend
    G1 E-1100 F12000 # Rapid unload
    G92 E0
    G90

[gcode_macro BED_ON]
gcode:
    SET_PIN PIN=BedSSR VALUE=1
[gcode_macro BED_OFF]
gcode:
    SET_PIN PIN=BedSSR VALUE=0

[gcode_macro LIGHTS_ON]
gcode:
    SET_PIN PIN=EnclosureLights VALUE=1
[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=EnclosureLights VALUE=0

[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}


