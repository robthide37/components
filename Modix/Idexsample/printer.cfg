## Bed/table

[quad_gantry_level]
#   Use QUAD_GANTRY_LEVEL to level a gantry.
gantry_corners:
   -183,-18
   681,701
#   Min & Max gantry corners - measure from nozzle at MIN (0,0) and MAX (250,250) to respective belt positions
points:    # Probe points
   53,82.5  # 50,50 from 0,0, plus probe offset of -3, -32.5
   53,582.5
   573,582.5  # 570,570 (Y-max of 620 - 50) from 0,0, plus probe offset of -3, -32.5
   573,82.5
