# Modix 620 IDEX   (230724a)

[printer]
kinematics: cartesian
max_velocity: 600
max_accel:7500
#max_accel_to_decel:7000
square_corner_velocity:5
max_z_velocity: 15
max_z_accel: 420

[mcu]
canbus_uuid=21e5b89015f1
[mcu head0]
canbus_uuid=97ee75cbc41f
[mcu head1]
canbus_uuid=2bf0c3835c71

[exclude_object]

[include mainsail.cfg]

[include Dual.cfg]

[include timelapse.cfg]

[include euclid.cfg]


## ---------------------------------------------
## Axis

[force_move]
enable_force_move: True

[stepper_x]
enable_pin: !PE0
step_pin: PE6
dir_pin: PA14
rotation_distance: 32
microsteps: 1
full_steps_per_rotation: 4000
endstop_pin: PG6
position_endstop: -1
position_max: 632
position_min: -1
homing_speed: 100
step_pulse_duration:.000003
homing_retract_dist: 1

[stepper_x1]
enable_pin: !PD4
step_pin: PE2
dir_pin: !PE3
rotation_distance: 32
microsteps: 1
full_steps_per_rotation: 4000
step_pulse_duration:.000003
endstop_pin: PG9

[stepper_y]
enable_pin: !PG2
step_pin: PF9
dir_pin: PF10
rotation_distance: 32
microsteps: 1
full_steps_per_rotation: 4000
homing_positive_dir: false
endstop_pin: head0:PA14
position_endstop:-18
position_min: -18
position_max: 598
homing_speed: 100
homing_retract_dist: 1
step_pulse_duration:.000003

[dual_carriage]
axis:y
enable_pin: !PF1
step_pin: PC13
dir_pin: PF0
rotation_distance: 32
microsteps: 1
full_steps_per_rotation:4000
homing_positive_dir: true
step_pulse_duration:.000003
endstop_pin: head1:PA14
homing_speed: 100
position_endstop:660.25
position_min:42
position_max:660.25
homing_retract_dist: 1

[stepper_z]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
gear_ratio: 2.5:1
microsteps: 1
rotation_distance: 4
full_steps_per_rotation: 4000
step_pulse_duration:.000003
homing_speed: 4
endstop_pin:probe:z_virtual_endstop
position_max: 600
position_min: -5

[stepper_z1]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 4
gear_ratio: 2.5:1
microsteps: 1
full_steps_per_rotation: 4000
step_pulse_duration:.000003

[stepper_z2]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 4
gear_ratio: 2.5:1
microsteps: 1
full_steps_per_rotation: 4000
step_pulse_duration:.000003

[stepper_z3]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 4
gear_ratio: 2.5:1
microsteps: 1
full_steps_per_rotation: 4000
step_pulse_duration:.000003


## ---------------------------------------------
## Extruders

[extruder]  ; Primary
step_pin:head0:PB3
dir_pin:!head0:PB4
enable_pin: !head0:PB5
heater_pin: head0:PA6  # "HEAT"
rotation_distance :7.702
microsteps: 64
nozzle_diameter: 0.500
filament_diameter: 1.750
sensor_type: PT1000
sensor_pin: head0:PA0 # "THERMISTOR"
pullup_resistor: 2200 # The board uses a 2.2k ohm pullup to work with a PT1000 
min_temp: -50
max_temp: 450
max_extrude_only_distance: 1200.0
pressure_advance : .025
pressure_advance_smooth_time: .02
smooth_time: .1

[tmc2209 extruder]  ; Primary driver
uart_pin: head0:PA10
tx_pin: head0:PA9
interpolate: False
run_current: 0.52
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 1
driver_HEND: 10
driver_HSTRT: 7
driver_TOFF: 4

[extruder_stepper extrudertandem] ; Tandem for Primary
extruder: extruder
step_pin: PA7
dir_pin: !PB2
enable_pin: !PC15
rotation_distance:7.702
microsteps: 64

[tmc5160 extruder_stepper extrudertandem] ; Driver for Tandem Primary
cs_pin:PE13
spi_software_sclk_pin:PB13
spi_software_mosi_pin:PC3
spi_software_miso_pin:PC2
run_current: .52

[extruder1]  ; Secondary
step_pin:head1:PB3
dir_pin:head1:PB4
enable_pin: !head1:PB5
heater_pin: head1:PA6  # "HEAT"
rotation_distance :7.702
microsteps: 64
nozzle_diameter: 0.500
filament_diameter: 1.750
sensor_type: PT1000
sensor_pin: head1:PA0 # "THERMISTOR"
pullup_resistor: 2200 # The board uses a 2.2k ohm pullup to work with a PT1000 
min_temp: -50
max_temp: 450
max_extrude_only_distance: 1200.0
pressure_advance : .034
pressure_advance_smooth_time: .02
smooth_time: .1

[tmc2209 extruder1]  ; Secondary driver
uart_pin: head1:PA10
tx_pin: head1:PA9
interpolate: False
run_current: 0.52
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 1
driver_HEND: 10
driver_HSTRT: 7
driver_TOFF: 4

[extruder_stepper extrudertandem1] # Tandem for Secondary
extruder: extruder1
step_pin: PB1
dir_pin: !PA4
enable_pin: !PE15
rotation_distance:7.702
microsteps: 64

[tmc5160 extruder_stepper extrudertandem1] # Driver for Tandem Secondary
cs_pin:PE10     # PE10 = M2RX  (Motor 2)
spi_software_sclk_pin:PB13
spi_software_mosi_pin:PC3
spi_software_miso_pin:PC2
run_current: 0.52  


